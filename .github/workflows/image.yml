name: image

# The glasswing-server image (crates/server + baked-in models).
# PRs: build and scan only. main: build, scan, push, SBOM attestation, signature.
# The scan runs before the push, so a failing gate keeps the image out of the registry.

on:
  pull_request:
    paths: ["crates/**", "Cargo.*", "Dockerfile", "assets/**", ".github/workflows/image.yml"]
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", "Dockerfile", "assets/**", ".github/workflows/image.yml"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tmukh/glasswing-server

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # OIDC token for keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          DOCKER_BUILDKIT=1 docker build -t "$IMAGE:$TAG" .

      # Report everything, gate on fixable HIGH/CRITICAL (same policy as the other repos).
      - name: Trivy report (all findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: table
          exit-code: "0"
      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Smoke test
        run: |
          docker run -d --name s -p 8080:8080 "$IMAGE:$TAG"
          for i in $(seq 60); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sfN localhost:8080/v1/generate -H 'content-type: application/json' \
            -d '{"model":"smollm2","prompt":"What is the capital of France?","max_tokens":12,"temperature":0}' \
            | tee out.txt
          grep -q Paris out.txt
          docker logs s

      - name: Push
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Pushed $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'

      - name: Sign and attest SBOM
        if: github.event_name == 'push'
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
