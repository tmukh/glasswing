[package]
name = "glasswing-engine"
description = "A small Llama-style transformer, written from scratch, that reports what happens inside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fancy-regex = { version = "0.19.2", optional = true }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
# Hugging Face tokenizers (GPT-2 style byte-level BPE), for real models like SmolLM2.
# Off by default: the browser build doesn't need a regex engine.
hf = ["dep:fancy-regex"]
# Split matrix rows across CPU cores (rayon). For servers; the browser build stays single-threaded.
parallel = ["dep:rayon"]
rayon = ["dep:rayon"]
