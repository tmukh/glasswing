[project]
name = "glasswing-train"
version = "0.1.0"
description = "Tokenizer, reference model, training and export for glasswing"
authors = [
    { name = "Tarik Abu Mukh", email = "t.abu.mukh@tu-berlin.de" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "safetensors>=0.6",
    "torch>=2.9",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# CUDA build on my Windows machine (RTX 3060 Ti), CPU build in CI (Linux runners have no GPU,
# and the CPU wheel is ~200 MB instead of ~3 GB).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
