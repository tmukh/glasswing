[project]
name = "glasswing-train"
version = "0.1.0"
description = "Tokenizer, reference model, training and export for glasswing"
authors = [
    { name = "Tarik Abu Mukh", email = "t.abu.mukh@tu-berlin.de" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
